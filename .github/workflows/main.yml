name: Unity Linux IL2CPP Mod Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 下载代码
      uses: actions/checkout@v4

    - name: 2. 安装 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 3. 编译项目
      run: |
        # 1. 先把 refs.zip 解压到当前根目录
        unzip -o ./refs.zip
        
        # 2. 执行编译
        dotnet restore ./PolyfieldMasterAdmin.csproj
        dotnet build ./PolyfieldMasterAdmin.csproj --configuration Release


    - name: 4. 打包并上传成果
      run: |
        mkdir -p Build-Artifacts
        # 寻找编译生成的 DLL
        find ./bin/Release -name "*.dll" -exec cp {} ./Build-Artifacts/ \;
        
        if [ "$(ls -A Build-Artifacts)" ]; then
          cd Build-Artifacts && zip -r ../Polyfield-Mod.zip .
          echo "编译成功！已生成 Polyfield-Mod.zip"
        else
          echo "未找到生成的 DLL，编译可能失败。"
          exit 1
        fi

    - name: 5. 上传 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Polyfield-Mod-DLL
        path: Polyfield-Mod.zip
        
