name: Unity Mod Cloud Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 强制解压 refs.zip
      run: |
        unzip -o refs.zip
        echo "依赖库已解压，当前文件列表："
        ls -l

    - name: 3. 安装 .NET 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 4. 终极强制编译
      run: |
        # 打印当前目录，确保文件确实存在
        echo "当前目录文件："
        ls -l .
        
        # 强制直接指定完整路径编译，不让它再去找了
        dotnet build ./PolyfieldMasterAdmin.csproj -p:Configuration=Release
        
        echo "编译指令执行完毕。"

    - name: 5. 打包生成的文件
      run: |
        mkdir -p Build-Artifacts
        # 暴力寻找所有生成的 DLL
        find . -path "*/bin/Release/*" -name "*.dll" -exec cp {} ./Build-Artifacts/ \;
        
        if [ "$(ls -A Build-Artifacts)" ]; then
          cd Build-Artifacts && zip -r ../Mod-Output.zip . && cd ..
          echo "已打包生成 Mod-Output.zip"
        else
          echo "未找到生成的 DLL"
          exit 1
        fi

    - name: 6. 上传编译结果
      uses: actions/upload-artifact@v4
      with:
        name: Polyfield-Mod-DLL
        path: Mod-Output.zip
