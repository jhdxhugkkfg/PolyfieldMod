name: Unity Mod Cloud Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 解压 refs.zip 依赖包
      run: |
        unzip -o refs.zip
        echo "依赖库已解压完成！"

    - name: 3. 安装 .NET SDK 编译环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 4. 编译 Mod 项目
      run: |
        echo "当前目录文件列表："
        ls -l
        
        # 使用绝对正确的文件名进行编译
        dotnet build ./PolyfieldMasterAdmin.csproj -p:Configuration=Release

    - name: 5. 打包生成的 DLL 文件
      run: |
        mkdir -p Build-Artifacts
        find . -path "*/bin/Release/*" -name "*.dll" -exec cp {} ./Build-Artifacts/ \;
        
        if [ "$(ls -A Build-Artifacts)" ]; then
          cd Build-Artifacts && zip -r ../Mod-Output.zip . && cd ..
          echo "已成功打包生成 Mod-Output.zip"
        else
          echo "未找到生成的 DLL 文件，编译可能未成功。"
          exit 1
        fi

    - name: 6. 上传 Artifacts 供下载
      uses: actions/upload-artifact@v4
      with:
        name: Polyfield-Mod-DLL
        path: Mod-Output.zip
