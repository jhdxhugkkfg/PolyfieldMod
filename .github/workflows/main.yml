name: .NET Build & Release

on:
  push:
    branches: [ main ]

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 下载云端代码
      uses: actions/checkout@v4

    - name: 2. 安装云端编译环境
      uses: actions/setup-dotnet@v4  # 这里已修正为正确的 v4 版本
      with:
        dotnet-version: '8.0.x'

    - name: 3. 编译项目
      run: dotnet build --configuration Release

    - name: 4. 打包所有编译成果
      run: |
        mkdir -p Build-Artifacts
        find . -path "*/Release/*" \( -name "*.dll" -o -name "*.pdb" -o -name "*.exe" \) -exec cp {} ./Build-Artifacts/ \; 2>/dev/null || true
        cd Build-Artifacts && zip -r ../Release-Build.zip . && cd ..

    - name: 5. 上传成品
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Custom-Build
        path: Release-Build.zip
